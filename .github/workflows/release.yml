name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Verify release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}
          PETITLYRICS_USER_ID: ${{ secrets.PETITLYRICS_USER_ID }}
          PETITLYRICS_APP_NAME: ${{ secrets.PETITLYRICS_APP_NAME }}
          PETITLYRICS_PKG_NAME: ${{ secrets.PETITLYRICS_PKG_NAME }}
          PETITLYRICS_CLIENT_APP_ID: ${{ secrets.PETITLYRICS_CLIENT_APP_ID }}
        run: |
          missing=0
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD \
            PETITLYRICS_USER_ID \
            PETITLYRICS_APP_NAME \
            PETITLYRICS_PKG_NAME \
            PETITLYRICS_CLIENT_APP_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aalyrics-release.keystore"

      - name: Resolve release version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH or -alpha.N/-beta.N/-rc.N, for example v0.1.0-alpha.1."
            exit 1
          fi
          version_name="${GITHUB_REF_NAME#v}"
          echo "AALYRICS_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "AALYRICS_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Verify changelog release version
        shell: bash
        run: |
          changelog_version="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)"
          if [[ -z "$changelog_version" ]]; then
            echo "CHANGELOG.md does not contain a release heading in the form: ## [VERSION] - YYYY-MM-DD"
            exit 1
          fi
          if [[ "$changelog_version" != "$AALYRICS_VERSION_NAME" ]]; then
            echo "Release tag version '$AALYRICS_VERSION_NAME' does not match newest CHANGELOG.md version '$changelog_version'."
            echo "Update CHANGELOG.md before creating the release tag."
            exit 1
          fi

      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build signed release APK
        env:
          PETITLYRICS_USER_ID: ${{ secrets.PETITLYRICS_USER_ID }}
          PETITLYRICS_APP_NAME: ${{ secrets.PETITLYRICS_APP_NAME }}
          PETITLYRICS_PKG_NAME: ${{ secrets.PETITLYRICS_PKG_NAME }}
          PETITLYRICS_CLIENT_APP_ID: ${{ secrets.PETITLYRICS_CLIENT_APP_ID }}
          AALYRICS_RELEASE_STORE_FILE: ${{ runner.temp }}/aalyrics-release.keystore
          AALYRICS_RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
          AALYRICS_RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
          AALYRICS_RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist
          apk_name="AALyrics-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk_name"
          (
            cd dist
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            "dist/AALyrics-${GITHUB_REF_NAME}.apk"
            "dist/AALyrics-${GITHUB_REF_NAME}.apk.sha256"
            --title "AALyrics $GITHUB_REF_NAME"
            --generate-notes
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
