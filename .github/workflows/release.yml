name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PETITLYRICS_USER_ID: ${{ secrets.PETITLYRICS_USER_ID }}
      PETITLYRICS_APP_NAME: ${{ secrets.PETITLYRICS_APP_NAME }}
      PETITLYRICS_PKG_NAME: ${{ secrets.PETITLYRICS_PKG_NAME }}
      PETITLYRICS_CLIENT_APP_ID: ${{ secrets.PETITLYRICS_CLIENT_APP_ID }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi

      - name: Verify release secrets
        shell: bash
        run: |
          missing=0
          for name in             RELEASE_KEYSTORE_BASE64             RELEASE_STORE_PASSWORD             RELEASE_KEY_ALIAS             RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/aalyrics-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "AALYRICS_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "AALYRICS_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AALYRICS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AALYRICS_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve release version
        shell: bash
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [[ -z "$version_name" || "$version_name" == "$GITHUB_REF_NAME" ]]; then
            echo "Release tag must start with v, for example v0.1.0."
            exit 1
          fi
          echo "AALYRICS_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "AALYRICS_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p dist
          apk="dist/AALyrics-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AALyrics ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AALyrics-${{ github.ref_name }}.apk
            dist/AALyrics-${{ github.ref_name }}.apk.sha256
