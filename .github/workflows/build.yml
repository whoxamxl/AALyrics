name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_test_version:
        description: "Optional VERSION_NAME override for an update-flow test APK"
        required: false
        default: ""
        type: string
      update_test_release_signed:
        description: "Also build the update-test APK with the durable release signing identity"
        required: false
        default: false
        type: boolean
      update_test_version_code:
        description: "Android VERSION_CODE for the release-signed update-test APK; must be lower than the target published release"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Unreviewed pull-request code must never receive provider credentials.
      PETITLYRICS_USER_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_USER_ID || '' }}
      PETITLYRICS_APP_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_APP_NAME || '' }}
      PETITLYRICS_PKG_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_PKG_NAME || '' }}
      PETITLYRICS_CLIENT_APP_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_CLIENT_APP_ID || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|refactor|chore|docs|test|ci|build|release|hotfix)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Valid branch name: $BRANCH_NAME"
          else
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use one of: feature/*, fix/*, refactor/*, chore/*, docs/*, test/*, ci/*, build/*, release/*, hotfix/*"
            exit 1
          fi

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|chore|docs|test|ci|build|perf|style|revert)(\([a-z0-9._/-]+\))?(!)?: .+'
          failed=0

          while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ $pattern ]]; then
              echo "Valid: ${sha:0:7} $subject"
            else
              echo "Invalid: ${sha:0:7} $subject"
              failed=1
            fi
          done < <(git log --format='%H%x09%s' "$BASE_SHA..$HEAD_SHA")

          if (( failed )); then
            echo
            echo "Commit subjects must use one of:"
            echo "feat:, fix:, refactor:, chore:, docs:, test:, ci:, build:, perf:, style:, revert:"
            echo "Optional scope and breaking-change marker are allowed, e.g. fix(playback): ... or feat!: ..."
            exit 1
          fi

      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aalyrics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare direct debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/aalyrics-debug.apk

      - name: Upload direct debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/aalyrics-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14


      # Manual, reusable update-flow fixture. From Actions -> Build -> Run workflow,
      # choose the branch/ref under test and supply an older published version name.
      - name: Validate release-signed update-test inputs
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_release_signed
        shell: bash
        env:
          UPDATE_TEST_VERSION: ${{ inputs.update_test_version }}
          UPDATE_TEST_VERSION_CODE: ${{ inputs.update_test_version_code }}
        run: |
          if [[ -z "$UPDATE_TEST_VERSION" ]]; then
            echo "update_test_version is required for the release-signed update-test APK."
            exit 1
          fi
          if [[ ! "$UPDATE_TEST_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "update_test_version_code must be a positive integer."
            exit 1
          fi

      - name: Validate release signing secrets for update-test APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_release_signed
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.AALYRICS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.AALYRICS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.AALYRICS_RELEASE_KEY_PASSWORD }}
        run: |
          for key in             RELEASE_KEYSTORE_BASE64             RELEASE_STORE_PASSWORD             RELEASE_KEY_ALIAS             RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!key}" ]]; then
              echo "Missing required release signing secret: $key"
              exit 1
            fi
          done

      - name: Restore release keystore for update-test APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_release_signed
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.AALYRICS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aalyrics-release.keystore"
          chmod 600 "$RUNNER_TEMP/aalyrics-release.keystore"

      - name: Build update-test debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_version != ''
        env:
          AALYRICS_VERSION_NAME: ${{ inputs.update_test_version }}
        run: |
          ./gradlew :app:clean :app:assembleDebug --stacktrace
          mkdir -p update-test
          cp app/build/outputs/apk/debug/app-debug.apk update-test/aalyrics-update-test.apk
          cp app/build/outputs/apk/debug/app-debug.apk "update-test/aalyrics-update-test-${AALYRICS_VERSION_NAME}.apk"

      - name: Upload update-test debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: aalyrics-update-test-apk-${{ inputs.update_test_version }}
          path: update-test/aalyrics-update-test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload direct update-test APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_test_version != ''
        uses: actions/upload-artifact@v7
        with:
          path: update-test/aalyrics-update-test-${{ inputs.update_test_version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
