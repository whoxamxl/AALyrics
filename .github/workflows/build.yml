name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref }}

    steps:
      - name: Validate branch name
        shell: bash
        run: |
          if [[ "$BRANCH_NAME" =~ ^(feature|fix|refactor|chore|docs|test|ci|build|release|hotfix)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Valid branch name: $BRANCH_NAME"
          else
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Use one of: feature/*, fix/*, refactor/*, chore/*, docs/*, test/*, ci/*, build/*, release/*, hotfix/*"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    env:
      # Unreviewed pull-request code must never receive provider credentials.
      PETITLYRICS_USER_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_USER_ID || '' }}
      PETITLYRICS_APP_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_APP_NAME || '' }}
      PETITLYRICS_PKG_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_PKG_NAME || '' }}
      PETITLYRICS_CLIENT_APP_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PETITLYRICS_CLIENT_APP_ID || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify architecture boundaries
        run: bash scripts/verify-architecture.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Temporary compatibility probe. This is removed after validation.
      - name: Initialize CodeQL Kotlin compatibility probe
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Probe CodeQL Kotlin extraction
        run: ./gradlew --no-daemon --no-build-cache :provider:matching:clean :provider:matching:compileKotlin --rerun-tasks --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aalyrics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
