name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - build/add-gradle-wrapper

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate Gradle Wrapper when missing
        shell: bash
        run: |
          if [[ ! -f gradlew ]]; then
            gradle wrapper --gradle-version 9.6.0
          fi

      - name: Commit generated wrapper when changed
        shell: bash
        run: |
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Wrapper already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Gradle 9.6 wrapper"
          git push origin HEAD:build/add-gradle-wrapper
